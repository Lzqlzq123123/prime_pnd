  "left_elbow_pitch_joint": 5
  "left_wrist_roll_joint": 4
  "left_wrist_pitch_joint": 4
  "left_wrist_yaw_joint": 4
  "right_shoulder_pitch_joint": 5
  "right_shoulder_roll_joint": 5
  "right_shoulder_yaw_joint": 5
  "right_elbow_pitch_joint": 5
  "right_wrist_roll_joint": 4
  "right_wrist_pitch_joint": 4
  "right_wrist_yaw_joint": 4
  "neck_yaw_joint": 4
