ik_cfg:

  - adam_link_name: "left_wrist_yaw_link"
    bone_name: "LHR-6E8EC1F7" #左手腕LHR-6E8EC1F7
    position_cost: 10.0      # 降低权重，减少求解难度
    orientation_cost: 8.0    # 降低权重
    pos_offset: [0.0, 0.0, 0.0]
    rot_offset: [0.0572, 0.2412, 0.9564, 0.1546]

  - adam_link_name: "right_wrist_yaw_link"
    bone_name: "LHR-4622FDDD" #右手腕 
    position_cost: 10.0
    orientation_cost: 8.0
    pos_offset: [0.0, 0.0, 0.0]
    rot_offset: [-0.0091, -0.6852, 0.7236, -0.0821]

  - adam_link_name: "waist_yaw_link"
    bone_name: "LHR-31C9C2E6"  # 腰部 tracker ID
    position_cost: 0.0
    orientation_cost: 30.0
    pos_offset: [0.0, 0.0, 0.0]
    rot_offset: [1.0, 0.0, 0.0, 0.0]

  - adam_link_name: "chest_link"
    bone_name: "LHR-727BC33C"  # 胸部 tracker ID
    position_cost: 0.0
    orientation_cost: 30.0
    pos_offset: [0.0, 0.0, 0.0]
    rot_offset: [1.0, 0.0, 0.0, 0.0]

# 禁用碰撞避免
