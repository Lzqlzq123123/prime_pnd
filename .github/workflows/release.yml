name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop

    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential \
            coinor-libipopt-dev \
            gfortran \
            liblapack-dev \
            pkg-config \
            swig \
            git \
            git-lfs \
            cmake \
            python3 \
            python3-pip \
            python3-colcon-common-extensions \
            rsync

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache CasADi
        id: cache-casadi
        uses: actions/cache@v4
        with:
          path: /tmp/casadi-install
          key: casadi-3.6.7-${{ runner.arch }}

      - name: Build CasADi from source
        if: steps.cache-casadi.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          git clone --depth 1 --branch 3.6.7 https://github.com/casadi/casadi.git
          cd casadi && mkdir build && cd build
          cmake \
            -DWITH_PYTHON=ON \
            -DWITH_IPOPT=ON \
            -DWITH_OPENMP=ON \
            -DWITH_THREAD=ON \
            ..
          make -j$(nproc)
          DESTDIR=/tmp/casadi-install make install

      - name: Install CasADi
        run: |
          cp -a /tmp/casadi-install/usr/local/* /usr/local/
          ldconfig

      - name: Build ROS workspace
        run: ./build.sh

      - name: Package release
        run: ./scripts/package_release.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnd-teleop-${{ runner.arch }}
          path: release/*.tar.gz
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: release/*.tar.gz
          generate_release_notes: true
